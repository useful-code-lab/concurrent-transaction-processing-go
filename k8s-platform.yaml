apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "password"
        - name: POSTGRES_DB
          value: "concur_db"
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management-alpine
        ports:
        - containerPort: 5672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
spec:
  selector:
    app: rabbitmq
  ports:
    - protocol: TCP
      port: 5672
      targetPort: 5672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-server-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-server
  template:
    metadata:
      labels:
        app: platform-server
    spec:
      containers:
      - name: server-container
        image: concur-platform-server:v4
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: RABBITMQ_URL
          value: "amqp://guest:guest@rabbitmq-service:5672/"
        - name: DATABASE_URL
          value: "postgres://postgres:password@postgres-service:5432/concur_db?sslmode=disable"  
---
apiVersion: v1
kind: Service
metadata:
  name: platform-server-service
spec:
  selector:
    app: platform-server
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-worker-deployment
spec:
  replicas: 1 # Строго один поток для гарантированной последовательности обработки
  selector:
    matchLabels:
      app: platform-worker
  template:
    metadata:
      labels:
        app: platform-worker
    spec:
      containers:
      - name: worker-container
        image: concur-platform-worker:v3
        imagePullPolicy: Never
        env:
        - name: DATABASE_URL
          value: "postgres://postgres:password@postgres-service:5432/concur_db?sslmode=disable"
        - name: RABBITMQ_URL
          value: "amqp://guest:guest@rabbitmq-service:5672/"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-client-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: platform-client
  template:
    metadata:
      labels:
        app: platform-client
    spec:
      containers:
      - name: client-container
        image: concur-platform-client:v1
        imagePullPolicy: Never
        env:
        - name: SERVER_URL
          value: "ws://platform-server-service:8080/ws"
---
apiVersion: v1
kind: Service
metadata:
  name: platform-server-lb
spec:
  type: NodePort
  selector:
    app: platform-server
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
